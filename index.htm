<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Full Page Site</title>
    <style>
        /* Force the HTML and Body containers to be full width and height */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents accidental scrollbars */
        }

        /* Container for your content */
        .full-page-container {
            width: 100%;
            height: 100%;
            background-color: #2c3e50; /* Replace with your color or image */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div class="full-page-container">
        <h1>This content fills the entire browser window!</h1>
    </div>

</body>
</html>
